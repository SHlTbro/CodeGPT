# Local Codebase MCP 配置模板
# 复制本文件为 config.yaml（与 server.py 同目录），把 path 改成你本机真实项目目录。
# 完整键位与校验规则见 contracts/localcodebase-mcp-mvp.json 与 config.py。

projects:
  - id: my-project          # 唯一标识，AI 通过它指定项目
    name: My Project        # 显示名
    path: D:/code/my-project  # 本机绝对路径（正斜杠或双反斜杠均可）；必须是已存在的目录
    # write_enabled: true   # 可选：允许 AI 写该项目（默认关闭）；热重载 ≤5s 生效
    # write_roots:          # 可选：可写目录白名单（默认 [docs]），仅允许干净的相对目录名
    #   - docs
server:
  host: 127.0.0.1           # 仅允许本机回环地址（127.0.0.1 / localhost / ::1）
  port: 8000
  path: /mcp

# 可选段：缺省使用内置默认值
