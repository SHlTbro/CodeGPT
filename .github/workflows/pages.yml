name: Publish interactive showcase
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', 'licenses/showcase/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Include verified static assets
        run: |
          mkdir -p site/assets
          cp -R assets/. site/assets/
          mkdir -p site/licenses
          cp -R licenses/showcase site/licenses/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
